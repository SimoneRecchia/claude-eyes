[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-eyes"
version = "0.5.0"
description = "MCP server that gives Claude visual awareness of what happens on screen over time"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Simone Recchia" }]
license = { text = "MIT" }
keywords = [
  "mcp",
  "claude",
  "screen-recording",
  "computer-use",
  "visual-analysis",
  "animation-analysis",
  "anthropic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=1.0",
  "mss>=9.0",
  "Pillow>=10.0",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/SimoneRecchia/claude-eyes"
Repository = "https://github.com/SimoneRecchia/claude-eyes"
Issues = "https://github.com/SimoneRecchia/claude-eyes/issues"
"Source code" = "https://github.com/SimoneRecchia/claude-eyes"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
claude-eyes = "claude_eyes.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_eyes"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src/claude_eyes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
